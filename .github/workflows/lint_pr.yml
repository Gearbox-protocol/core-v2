name: "Lint PR"

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Debug Before
        run: |
          echo "Before main steps"
          echo "GitHub Context: ${{ toJSON(github) }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"'
          
          
  
